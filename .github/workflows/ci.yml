name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1

jobs:
  # ── Rust tests (no Python needed) ──────────────────────────────────────────
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check -p sqlparse-core

      - name: Clippy
        run: cargo clippy -p sqlparse-core -- -D warnings

      - name: Run Rust tests
        run: cargo test -p sqlparse-core

  # ── Python tests (requires maturin build) ──────────────────────────────────
  python:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # actions/setup-python puts the exact version on PATH so maturin-action
      # picks it up correctly via --find-interpreter.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-

      - name: Install Python test dependencies
        run: pip install pytest sqlparse pytest-cov

      # maturin-action builds a wheel for the Python on PATH, outputs to dist/
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --manifest-path crates/sqlparse-py/Cargo.toml
            --out dist
            --find-interpreter

      - name: Install wheel
        run: pip install dist/*.whl --no-index --find-links dist/

      - name: Run Python tests
        run: pytest tests/ -v --tb=short --cov=sqlparse_rs --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  # ── Parity gate: byte-identical output vs real sqlparse ────────────────────
  parity:
    name: Parity gate (sqlparse 0.6.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-parity-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-parity-cargo-

      - name: Install Python test dependencies
        run: pip install "sqlparse==0.6.0" pytest

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --manifest-path crates/sqlparse-py/Cargo.toml
            --out dist
            --find-interpreter

      - name: Install wheel
        run: pip install dist/*.whl --no-index --find-links dist/

      - name: Run parity and wrapper tests
        run: pytest tests/test_parity.py tests/test_wrapper.py -v --tb=short

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: tests/parity-report.md

  # ── Build wheel (smoke test, no upload) ────────────────────────────────────
  build-wheel:
    name: Build wheel (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --manifest-path crates/sqlparse-py/Cargo.toml
            --release
            --out dist
            --find-interpreter

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          retention-days: 7

  # ── GitHub Release (tag-triggered, no PyPI needed) ─────────────────────────
  # Fires only on `v*` tags (e.g. git tag v0.1.0b1 && git push --tags).
  # Attaches the wheel to the release as a downloadable asset.
  # Install without PyPI: pip install <release-asset-url>
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, python, parity, build-wheel]
    permissions:
      contents: write  # needed to create/update the release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release wheel (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --manifest-path crates/sqlparse-py/Cargo.toml
            --release
            --out dist
            --find-interpreter
          manylinux: auto

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
