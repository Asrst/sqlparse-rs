[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "sqlparse-rs"
version = "0.1.0"
description = "Rust accelerator for python-sqlparse hot paths (tokenize, split) - byte-identical, linear time"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
]

[tool.maturin]
module-name = "sqlparse_rs"
